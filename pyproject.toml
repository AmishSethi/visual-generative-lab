[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vgl"
version = "1.0.0"
description = "Visual Generative Lab: controlled study of skill generalization in diffusion models"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Amish Sethi" },
  { name = "Boya Zeng" },
  { name = "Wenhao Chai" },
  { name = "Zhuang Liu" },
]
keywords = ["diffusion models", "generalization", "generative models", "benchmark"]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dynamic = ["dependencies"]

[project.urls]
Paper = "https://arxiv.org/abs/XXXX.XXXXX"
Repository = "https://github.com/AmishSethi/visual-generative-lab"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["vgl*", "scripts*", "paper_runs*"]
